http {
    upstream backend {
        server  ${UPSTREAM_HOST}:${UPSTREAM_PORT};
    }

    server {
        listen      80;
        server_name 0.0.0.0;

        location / {
            proxy_pass http://backend;
            proxy_set_header Authorization "Bearer ${WEB_PASSWORD}";

            # Enable WebSockets and HTTP/1.1 (Crucial for mitmweb)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;

            # Disable buffering to keep data streaming smooth
            proxy_buffering off;
        }
    }
}
events {}